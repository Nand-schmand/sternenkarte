    body {

      max-width: 500px;

      border-radius: 6px;
      padding: 1px 8px;
      margin-left: 8px;
      cursor: pointer;

    #leiste {
      display: flex;
      gap: 2px;
      max-width: 900px;

      flex: 1;
      height: 34px;
      border-radius: 4px;

      font-size: 11px;
      color: #0b1020;

    }
    #leiste div.gewaehlt {
      outline: 2px solid #ffffff;
      outline-offset: 1px;
    }
    #karte {
      height: calc(100vh - 175px);
      min-height: 400px;
      background: #0b1020;   /* dunkler Nachthimmel statt Hintergrundkarte */

    /* Trick: die helle Straßenkarte per Filter in eine dunkle "Nachtkarte" verwandeln */

    /* Das Kästchen-Bild scharf statt verschwommen vergrößern */
    .leaflet-image-layer {
      image-rendering: pixelated;
    }
    .legende {
      background: rgba(11, 16, 32, 0.9);
      color: #e8ecf5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }
    .legende span {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
    }

  <script>
    // ===== LOGIK (JavaScript) =====

    // ---------- 1. Einstellungen ----------
    // Das Rechteck um Deutschland (Süden, Norden, Westen, Osten)
    const SUED = 47.3, NORD = 55.1, WEST = 5.9, OST = 15.1;

    // Abstand der Messpunkte im Gitter (in Grad)
    const SCHRITT_BREITE = 0.3;   // ca. 33 km nach Norden/Süden
    const SCHRITT_LAENGE = 0.45;  // ca. 32 km nach Osten/Westen

    // ---------- 2. Die Karte erstellen ----------
    const karte = L.map("karte", { maxZoom: 11 });
    karte.attributionControl.setPrefix(false);
    karte.attributionControl.addAttribution("Wetter: Open-Meteo.com | Grenzen: deutschlandGeoJSON");

    // Eine eigene Ebene für die Grenzen, damit sie ÜBER den farbigen Kästchen liegen
    karte.createPane("grenzen");
    karte.getPane("grenzen").style.zIndex = 450;
    karte.getPane("grenzen").style.pointerEvents = "none";

    // Die Umrisse der Bundesländer zeichnen – wir brauchen also keine fremde Hintergrundkarte
    const grenzen = L.geoJSON(DEUTSCHLAND, {
      pane: "grenzen",
      style: { color: "#c9d4f2", weight: 1, opacity: 0.8, fill: false }
    }).addTo(karte);

    // Die Straßenkarte von OpenStreetMap darunterlegen – aber nur, wenn die App online läuft.
    // (Direkt vom eigenen Rechner geöffnet blockiert OpenStreetMap die Karte.)
    if (location.protocol !== "file:") {
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 11,
        attribution: "© OpenStreetMap-Mitwirkende | Orte: GeoNames"
      }).addTo(karte);
    }

    // Die Karte so zoomen, dass ganz Deutschland zu sehen ist
    karte.fitBounds(grenzen.getBounds());

    // ---------- 3. Das Gitter aus Messpunkten bauen ----------
    // Liegt ein Punkt innerhalb einer Fläche? Wir ziehen gedanklich eine Linie nach rechts
    // und zählen, wie oft sie die Grenze kreuzt. Ungerade Zahl = drinnen, gerade = draußen.
    function punktInRing(x, y, ring) {
      let drinnen = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) {
          drinnen = !drinnen;
        }
      }
      return drinnen;
    }
    function punktInFlaeche(x, y, flaeche) {
      if (!punktInRing(x, y, flaeche[0])) return false;      // außerhalb des Umrisses
      for (let k = 1; k < flaeche.length; k++) {              // in einem "Loch"? (z. B. Berlin in Brandenburg)
        if (punktInRing(x, y, flaeche[k])) return false;
      }
      return true;
    }
    // Gibt den Namen des Bundeslands zurück – oder null, wenn der Punkt nicht in Deutschland liegt
    function bundeslandVon(breite, laenge) {
      for (const land of DEUTSCHLAND.features) {
        const g = land.geometry;
        const flaechen = (g.type === "Polygon") ? [g.coordinates] : g.coordinates;
        for (const flaeche of flaechen) {
          if (punktInFlaeche(laenge, breite, flaeche)) return land.properties.name;
        }
      }
      return null;
    }

    // Wir gehen Zeile für Zeile und Spalte für Spalte durch das Rechteck
    // und behalten nur die Punkte, die wirklich in Deutschland liegen.
    const punkte = [];
    for (let breite = SUED; breite <= NORD; breite += SCHRITT_BREITE) {
      for (let laenge = WEST; laenge <= OST; laenge += SCHRITT_LAENGE) {
        const b = Math.round(breite * 100) / 100;
        const l = Math.round(laenge * 100) / 100;
        const land = bundeslandVon(b, l);
        if (land) punkte.push({ breite: b, laenge: l, land: land });
      }
    }

    // ---------- 4. Der Sterne-Score ----------
    // Vier Fragen entscheiden, ob man Sterne sieht:
    //   1. Sind Wolken im Weg?            (aus den Wetterdaten)
    //   2. Stört der Mond?                (berechnet mit SunCalc)
    //   3. Ist es überhaupt schon dunkel? (Sonne berechnet mit SunCalc)
    //   4. Wie hell sind Städte in der Nähe? (Lichtverschmutzung aus der Tabelle oben)
    // Jede Frage ergibt einen Faktor zwischen 0 (ganz schlecht) und 1 (perfekt).
    // Die Faktoren werden multipliziert – ist einer 0, ist alles 0.

    const GRAD = 180 / Math.PI;   // SunCalc rechnet im Bogenmaß, wir wollen Grad

    // Schlägt die Lichtverschmutzungs-Stufe (0–9) für einen Ort nach.
    // Wir rechnen aus, in welcher Zeile und Spalte der Ziffernfolge der Ort liegt.
    function lichtStufe(breite, laenge) {
      const zeile = Math.round((breite - LICHT.sued) / LICHT.schrittB);
      const spalte = Math.round((laenge - LICHT.west) / LICHT.schrittL);
      const ziffer = LICHT.stufen[zeile * LICHT.spalten + spalte];
      return ziffer === undefined ? 0 : Number(ziffer);
    }
    function lichtText(stufe) {
      if (stufe <= 2) return "sehr dunkel 🌌";
      if (stufe <= 4) return "ländlich";
      if (stufe <= 6) return "Vorort / Kleinstadt";
      return "Stadt – hell";
    }

    function sterneScore(bewoelkung, breite, laenge, zeitpunkt) {
      // 1. Wolken: 0 % Wolken -> 1,  100 % Wolken -> 0
      const wolkenFaktor = 1 - bewoelkung / 100;

      // 2. Mond: Wie hell ist er, und wie hoch steht er?
      const mondLicht = SunCalc.getMoonIllumination(zeitpunkt).fraction;           // 0 = Neumond, 1 = Vollmond
      const mondHoehe = SunCalc.getMoonPosition(zeitpunkt, breite, laenge).altitude * GRAD;
      let mondFaktor = 1;
      if (mondHoehe > 0) {
        // Je voller und je höher (bis 30°), desto mehr stört er. Vollmond hoch oben: Faktor 0,4
        const hoehenAnteil = Math.min(mondHoehe, 30) / 30;
        mondFaktor = 1 - 0.6 * mondLicht * hoehenAnteil;
      }

      // 3. Dunkelheit: Erst wenn die Sonne 18° unter dem Horizont ist, ist es richtig dunkel
      const sonnenHoehe = SunCalc.getPosition(zeitpunkt, breite, laenge).altitude * GRAD;
      let dunkelFaktor;
      if (sonnenHoehe <= -18) dunkelFaktor = 1;        // tiefe Nacht
      else if (sonnenHoehe >= -6) dunkelFaktor = 0;    // noch zu hell (Dämmerung oder Tag)
      else dunkelFaktor = (-6 - sonnenHoehe) / 12;     // dazwischen: langsam dunkler

      // 4. Lichtverschmutzung: Stufe 0 -> 1 (perfekt),  Stufe 9 (Großstadt) -> ca. 0,4
      const licht = lichtStufe(breite, laenge);
      const lichtFaktor = 1 - 0.065 * licht;

      const score = Math.round(100 * wolkenFaktor * mondFaktor * dunkelFaktor * lichtFaktor);
      return { score, mondLicht, mondHoehe, sonnenHoehe, licht };
    }

    // Farbe passend zum Score: hoch = grün (gut), niedrig = grau (schlecht)
    function farbeFuer(score) {
      if (score >= 80) return "#2ecc71";  // top!
      if (score >= 60) return "#a3d977";  // gut
      if (score >= 40) return "#f1c40f";  // geht so
      if (score >= 20) return "#e67e22";  // eher schlecht
      return "#555c6e";                   // keine Chance
    }
    function textFuer(score) {
      if (score >= 80) return "🌟 Perfekt für Sterne!";
      if (score >= 60) return "🙂 Gut";
      if (score >= 40) return "😐 Geht so";
      if (score >= 20) return "🙁 Eher schlecht";
      return "❌ Keine Chance";
    }

    // Passendes Mond-Symbol: phase geht von 0 (Neumond) über 0,5 (Vollmond) bis 1
    function mondSymbol(phase) {
      const symbole = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
      return symbole[Math.round(phase * 8) % 8];
    }

    // ---------- 5. Daten bei Open-Meteo bestellen ----------
    // Genau wie deine Adresse im Browser – nur für viele Orte auf einmal.
    // Wir bestellen in Paketen zu je 100 Orten, damit die Adresse nicht zu lang wird.
    async function ladeDaten(punktListe) {
      const pakete = [];
      for (let i = 0; i < punktListe.length; i += 100) {
        pakete.push(punktListe.slice(i, i + 100));
      }

      const antworten = await Promise.all(pakete.map(async (paket) => {
        const breiten = paket.map(p => p.breite).join(",");
        const laengen = paket.map(p => p.laenge).join(",");
        const adresse =
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=" + breiten +
          "&longitude=" + laengen +
          "&hourly=cloud_cover" +
          "&timezone=Europe%2FBerlin" +
          "&forecast_days=2";

        const antwort = await fetch(adresse);
        if (antwort.status === 429) {
          throw new Error("Open-Meteo-Limit erreicht (zu viele Abfragen). Die App versucht es jede Minute automatisch neu");
        }
        if (!antwort.ok) throw new Error("Open-Meteo antwortet nicht (" + antwort.status + ")");
        const daten = await antwort.json();
        // Bei mehreren Orten kommt eine Liste zurück, bei einem Ort ein einzelnes Objekt
        return Array.isArray(daten) ? daten : [daten];
      }));

      // Alle Pakete wieder zu einer langen Liste zusammenkleben
      return antworten.flat();
    }

    // ---------- 6. Das feine 5-km-Bild ----------
    // Statt tausender einzelner Kästchen malen wir EIN Bild, in dem jeder Pixel
    // ein 5 x 5 km großes Stück Deutschland ist (dasselbe Raster wie die Lichtverschmutzung).
    // Wolken gibt es nur alle ~30 km – dazwischen schätzen wir sie aus den 4 nächsten
    // Messpunkten (je näher, desto mehr zählt der Punkt).
    const FEIN_BREITE = 0.1;    // Raster der echten feinen Wolkendaten beim Reinzoomen (ca. 11 km)
    const FEIN_LAENGE = 0.15;   // (ca. 10 km)
    const ZEILEN = LICHT.stufen.length / LICHT.spalten;

    let grobDaten = [];                 // Wetter der ~340 groben Messpunkte
    const feineWolken = new Map();      // echte 10-km-Wolkendaten, nachgeladen beim Zoomen
    const zellen = [];                  // alle 5-km-Stücke, die in Deutschland liegen
    const zellenNachPosition = new Map(); // zum schnellen Finden beim Anklicken
    let zeiten = [];                    // die Uhrzeiten aus der Antwort, z. B. "2026-11-17T22:00"
    let aktuelleStunde = 0;             // welche Stunde der Regler gerade zeigt

    // Einmal am Anfang: Für jedes 5-km-Stück merken, wo es liegt und welche Messpunkte nah sind
    function bereiteZellenVor() {
      for (let zeile = 0; zeile < ZEILEN; zeile++) {
        for (let spalte = 0; spalte < LICHT.spalten; spalte++) {
          const breite = LICHT.sued + zeile * LICHT.schrittB;
          const laenge = LICHT.west + spalte * LICHT.schrittL;
          const land = bundeslandVon(breite, laenge);
          if (!land) continue;   // nicht in Deutschland

          // Die 4 nächsten groben Messpunkte finden (0,63: ein Längengrad ist hier kürzer als ein Breitengrad)
          const naechste = punkte
            .map((p, i) => ({ i, abstand: (p.breite - breite) ** 2 + ((p.laenge - laenge) * 0.63) ** 2 }))
            .sort((a, b) => a.abstand - b.abstand)
            .slice(0, 4);
          // Gewicht: je näher, desto wichtiger. Danach so teilen, dass alle Gewichte zusammen 1 ergeben.
          let summe = 0;
          naechste.forEach(n => { n.gewicht = 1 / (n.abstand + 0.0001); summe += n.gewicht; });
          naechste.forEach(n => n.gewicht /= summe);

          // Welcher feine 10-km-Punkt liegt am nächsten? (Falls wir dort später echte Daten laden)
          const fb = Math.round(Math.round(breite / FEIN_BREITE) * FEIN_BREITE * 100) / 100;
          const fl = Math.round(Math.round(laenge / FEIN_LAENGE) * FEIN_LAENGE * 100) / 100;

          const zelle = { zeile, spalte, breite, laenge, land, naechste, feinSchluessel: fb + "," + fl };
          zellen.push(zelle);
          zellenNachPosition.set(zeile * LICHT.spalten + spalte, zelle);
        }
      }
    }

    // Bewölkung für ein 5-km-Stück: echte feine Daten, wenn vorhanden – sonst geschätzt
    function wolkenFuer(zelle, stunde = aktuelleStunde) {
      const fein = feineWolken.get(zelle.feinSchluessel);
      if (fein) return fein.hourly.cloud_cover[stunde];
      let wolken = 0;
      zelle.naechste.forEach(n => { wolken += grobDaten[n.i].hourly.cloud_cover[stunde] * n.gewicht; });
      return Math.round(wolken);
    }

    // Die Leinwand für das Bild. Karten im Internet sind nach Norden hin "gestreckt"
    // (Mercator-Projektion) – deshalb rechnen wir jede Zeile auf die richtige Höhe um.
    const leinwand = document.createElement("canvas");
    leinwand.width = LICHT.spalten;
    leinwand.height = 1000;
    const pinsel = leinwand.getContext("2d");

    const obenRand = LICHT.sued + (ZEILEN - 0.5) * LICHT.schrittB;
    const untenRand = LICHT.sued - 0.5 * LICHT.schrittB;
    const mercator = b => Math.log(Math.tan(Math.PI / 4 + b * Math.PI / 360));
    const yAufBild = b => (mercator(obenRand) - mercator(b)) / (mercator(obenRand) - mercator(untenRand)) * leinwand.height;

    const bildEbene = L.imageOverlay(leinwand.toDataURL(), [
      [untenRand, LICHT.west - LICHT.schrittL / 2],
      [obenRand, LICHT.west + (LICHT.spalten - 0.5) * LICHT.schrittL]
    ], { opacity: (location.protocol === "file:") ? 0.85 : 0.6 }).addTo(karte);

    // Malt das ganze Bild für die aktuelle Stunde neu
    function maleBild() {
      pinsel.clearRect(0, 0, leinwand.width, leinwand.height);
      const zeitpunkt = new Date(zeiten[aktuelleStunde]);
      zellen.forEach(zelle => {
        const h = sterneScore(wolkenFuer(zelle), zelle.breite, zelle.laenge, zeitpunkt);
        const yOben = yAufBild(zelle.breite + LICHT.schrittB / 2);
        const yUnten = yAufBild(zelle.breite - LICHT.schrittB / 2);
        pinsel.fillStyle = farbeFuer(h.score);
        pinsel.fillRect(zelle.spalte, yOben, 1, yUnten - yOben + 0.5);
      });
      bildEbene.setUrl(leinwand.toDataURL());
    }

    // Die Ortsliste einmal in handliche Pakete zerlegen: { breite, laenge, name }
    const ORTE = ORTE_TEXT.split(";").map(eintrag => {
      const [breite, laenge, name] = eintrag.split(",");
      return { breite: Number(breite), laenge: Number(laenge), name };
    });

    // Findet den nächstgelegenen Ort und die Entfernung in km
    function naechsterOrt(breite, laenge) {
      let bester = null, besterAbstand = Infinity;
      ORTE.forEach(ort => {
        const dy = (ort.breite - breite) * 111.2;                                  // km nach Norden/Süden
        const dx = (ort.laenge - laenge) * 111.2 * Math.cos(breite * Math.PI / 180); // km nach Osten/Westen
        const abstand = Math.sqrt(dx * dx + dy * dy);                              // Satz des Pythagoras
        if (abstand < besterAbstand) { bester = ort; besterAbstand = abstand; }
      });
      return { name: bester.name, km: besterAbstand };
    }

    // Klick auf die Karte: das 5-km-Stück finden und die Details anzeigen
    karte.on("click", (e) => {
      const zeile = Math.round((e.latlng.lat - LICHT.sued) / LICHT.schrittB);
      const spalte = Math.round((e.latlng.lng - LICHT.west) / LICHT.schrittL);
      const zelle = zellenNachPosition.get(zeile * LICHT.spalten + spalte);
      if (!zelle) return;
      const wolken = wolkenFuer(zelle);
      const h = sterneScore(wolken, zelle.breite, zelle.laenge, new Date(zeiten[aktuelleStunde]));
      const echt = feineWolken.has(zelle.feinSchluessel);
      const ort = naechsterOrt(e.latlng.lat, e.latlng.lng);
      const ortText = ort.km < 1.5 ? "in " + ort.name : "bei " + ort.name + " (" + Math.round(ort.km) + " km)";

      // Diesen Ort für die 24-Stunden-Leiste merken und mit einem Punkt markieren
      gewaehlterOrt = { zelle, text: ortText };
      ortsMarker.setLatLng(e.latlng).addTo(karte);
      zeichneLeiste();
      L.popup().setLatLng(e.latlng).setContent(
        "<b>📍 " + ortText + "</b><br>" +
        "<small>" + zelle.land + "</small><br>" +
        "Sterne-Score: <b>" + h.score + " / 100</b> – " + textFuer(h.score) + "<br>" +
        "☁️ Bewölkung: " + wolken + " % " + (echt ? "(gemessen, 10 km)" : "(geschätzt – reinzoomen für genauere Daten)") + "<br>" +
        "🌙 Mond: " + (h.mondHoehe > 0
          ? Math.round(h.mondLicht * 100) + " % beleuchtet, " + Math.round(h.mondHoehe) + "° über dem Horizont"
          : "untergegangen – stört nicht") + "<br>" +
        "🌅 " + (h.sonnenHoehe <= -18 ? "Richtig dunkel"
          : h.sonnenHoehe < -6 ? "Dämmerung" : "Noch zu hell") + "<br>" +
        "💡 Lichtverschmutzung: Stufe " + h.licht + " von 9 (" + lichtText(h.licht) + ")"
      ).openOn(karte);
    });

    // Stellt alles auf die gewählte Stunde um
    function zeigeStunde(stundenIndex) {
      aktuelleStunde = stundenIndex;
      maleBild();
      document.getElementById("zeitanzeige").textContent = schoeneZeit(zeiten[stundenIndex]);
      document.getElementById("zeitregler").value = stundenIndex;
      zeigeHimmelsinfo(new Date(zeiten[stundenIndex]));
      zeichneLeiste();
    }

    // ---------- 6b. Die 24-Stunden-Leiste ----------
    let gewaehlterOrt = null;   // null = Durchschnitt Deutschland, sonst der angeklickte Ort
    let ersteStunde = 0, letzteStunde = 0;   // Bereich der Leiste (jetzt bis +24 h)
    const ortsMarker = L.circleMarker([0, 0], { radius: 6, color: "#ffffff", weight: 2, fillOpacity: 0 });

    // Score für eine bestimmte Stunde – für den gewählten Ort oder als Deutschland-Durchschnitt
    function scoreFuerStunde(stunde) {
      const zeitpunkt = new Date(zeiten[stunde]);
      if (gewaehlterOrt) {
        const z = gewaehlterOrt.zelle;
        return sterneScore(wolkenFuer(z, stunde), z.breite, z.laenge, zeitpunkt).score;
      }
      // Durchschnitt über die ~340 groben Messpunkte
      let summe = 0;
      punkte.forEach((p, i) => {
        summe += sterneScore(grobDaten[i].hourly.cloud_cover[stunde], p.breite, p.laenge, zeitpunkt).score;
      });
      return Math.round(summe / punkte.length);
    }

    function zeichneLeiste() {
      const titel = document.getElementById("verlaufTitel");
      titel.innerHTML = gewaehlterOrt
        ? "Nächste 24 Stunden 📍 " + gewaehlterOrt.text + ' <button id="zurueck">Ganz Deutschland</button>'
        : "Nächste 24 Stunden – Durchschnitt Deutschland (klick auf die Karte für deinen Ort)";
      const knopf = document.getElementById("zurueck");
      if (knopf) knopf.onclick = () => { gewaehlterOrt = null; ortsMarker.remove(); zeichneLeiste(); };

      const leiste = document.getElementById("leiste");
      leiste.innerHTML = "";
      for (let stunde = ersteStunde; stunde <= letzteStunde; stunde++) {
        const score = scoreFuerStunde(stunde);
        const uhrzeit = zeiten[stunde].split("T")[1].slice(0, 2);   // "2026-11-18T22:00" -> "22"
        const kaestchen = document.createElement("div");
        kaestchen.style.background = farbeFuer(score);
        kaestchen.title = uhrzeit + " Uhr: Score " + score + " – " + textFuer(score);
        if (stunde % 3 === 0 || stunde === ersteStunde) kaestchen.textContent = uhrzeit;   // nur jede 3. Stunde beschriften
        if (stunde === aktuelleStunde) kaestchen.className = "gewaehlt";
        kaestchen.onclick = () => zeigeStunde(stunde);
        leiste.appendChild(kaestchen);
      }
    }

    // Die Zeile oben: Was macht der Mond gerade? (gerechnet für die Mitte Deutschlands)
    function zeigeHimmelsinfo(zeitpunkt) {
      const mond = SunCalc.getMoonIllumination(zeitpunkt);
      const hoehe = SunCalc.getMoonPosition(zeitpunkt, 51.2, 10.4).altitude * GRAD;
      const mondZeiten = SunCalc.getMoonTimes(zeitpunkt, 51.2, 10.4);
      const uhr = d => d ? d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr" : "keiner an diesem Tag";

      document.getElementById("himmelsinfo").textContent =
        mondSymbol(mond.phase) + " Mond zu " + Math.round(mond.fraction * 100) + " % beleuchtet · " +
        (hoehe > 0 ? "steht gerade am Himmel" : "ist gerade nicht zu sehen") +
        " · Aufgang " + uhr(mondZeiten.rise) + ", Untergang " + uhr(mondZeiten.set);
    }

    // Macht aus "2026-11-17T22:00" ein lesbares "Heute, 22:00 Uhr"
    function schoeneZeit(zeitText) {
      const [datum, uhrzeit] = zeitText.split("T");
      const heute = zeiten[0].split("T")[0];
      const tag = (datum === heute) ? "Heute" : "Morgen";
      return tag + ", " + uhrzeit + " Uhr";
    }

    // ---------- 7. Echte feine Wolkendaten beim Reinzoomen ----------
    const FEIN_AB_ZOOM = 8;     // ab dieser Zoomstufe laden wir echte 10-km-Wolkendaten
    const MAX_NEUE_ORTE = 450;  // Schutz vor zu vielen Abfragen auf einmal (Limit: 600 pro Minute)
    let laedtGerade = false;

    async function ladeFeineWolken() {
      const status = document.getElementById("status");
      if (karte.getZoom() < FEIN_AB_ZOOM) {
        status.textContent = "5-km-Kästchen, Wolken zwischen den Messpunkten geschätzt. Zoom hinein (+) für gemessene Wolken.";
        return;
      }
      if (laedtGerade) return;

      // Welche feinen Punkte liegen im sichtbaren Ausschnitt und sind noch NICHT geladen?
      const sicht = karte.getBounds();
      const neue = [];
      const bStart = Math.floor(sicht.getSouth() / FEIN_BREITE) * FEIN_BREITE;
      const lStart = Math.floor(sicht.getWest() / FEIN_LAENGE) * FEIN_LAENGE;
      for (let b = bStart; b <= sicht.getNorth() + FEIN_BREITE; b += FEIN_BREITE) {
        for (let l = lStart; l <= sicht.getEast() + FEIN_LAENGE; l += FEIN_LAENGE) {
          const breite = Math.round(b * 100) / 100;
          const laenge = Math.round(l * 100) / 100;
          const schluessel = breite + "," + laenge;
          if (feineWolken.has(schluessel)) continue;   // schon geladen
          if (bundeslandVon(breite, laenge)) neue.push({ breite, laenge, schluessel });
        }
      }

      if (neue.length === 0) {
        status.textContent = "Gemessene Wolken (10 km) für diesen Ausschnitt. Zoom raus (−) für ganz Deutschland.";
        return;
      }
      if (neue.length > MAX_NEUE_ORTE) {
        status.textContent = "Noch " + neue.length + " Orte in diesem Ausschnitt – zoom noch etwas näher heran für gemessene Wolken.";
        return;
      }

      laedtGerade = true;
      status.textContent = "Lade gemessene Wolken für " + neue.length + " Orte …";
      try {
        const daten = await ladeDaten(neue);
        neue.forEach((punkt, i) => feineWolken.set(punkt.schluessel, daten[i]));
        maleBild();
        status.textContent = "Gemessene Wolken (10 km) geladen. Schieb die Karte, um weitere Gebiete zu laden.";
      } catch (fehler) {
        status.textContent = "Feine Wolken konnten nicht geladen werden: " + fehler.message;
      }
      laedtGerade = false;
    }

    // ---------- 8. Legende unten rechts ----------
    const legende = L.control({ position: "bottomright" });
    legende.onAdd = function () {
      const box = L.DomUtil.create("div", "legende");
      box.innerHTML =
        "<b>Sterne-Score</b><br>" +
        '<span style="background:#2ecc71"></span>80–100 top<br>' +
        '<span style="background:#a3d977"></span>60–79 gut<br>' +
        '<span style="background:#f1c40f"></span>40–59 geht so<br>' +
        '<span style="background:#e67e22"></span>20–39 schlecht<br>' +
        '<span style="background:#555c6e"></span>0–19 keine Chance<br>' +
        '<small>Wolken × Mond × Dunkelheit × Licht</small>';
      return box;
    };
    legende.addTo(karte);

    // ---------- 9. Alles starten – und live halten ----------
    // Welche Stunde ist gerade? Als Text im Format der Wetterdaten, z. B. "2026-11-18T00:00"
    function jetztAlsText() {
      const jetzt = new Date();
      return jetzt.getFullYear() + "-" +
        String(jetzt.getMonth() + 1).padStart(2, "0") + "-" +
        String(jetzt.getDate()).padStart(2, "0") + "T" +
        String(jetzt.getHours()).padStart(2, "0") + ":00";
    }

    let geladenFuerStunde = "";   // für welche Stunde wir zuletzt Daten geholt haben

    // ---- Zwischenspeicher (Cache) im Browser ----
    // Damit nicht jedes Neuladen der Seite wieder ~340 Abfragen kostet, merkt sich der Browser
    // die Wetterdaten der aktuellen Stunde. Erst in der nächsten Stunde wird neu gefragt.
    const CACHE_NAME = "sternenkarte-wetter-v1";

    function ausCacheHolen() {
      try {
        const gespeichert = JSON.parse(localStorage.getItem(CACHE_NAME));
        if (gespeichert && gespeichert.stunde === jetztAlsText() && gespeichert.anzahl === punkte.length) {
          // Zurück ins gewohnte Format: eine Liste mit { hourly: { time, cloud_cover } }
          return gespeichert.wolken.map(w => ({ hourly: { time: gespeichert.zeiten, cloud_cover: w } }));
        }
      } catch (fehler) { /* kein Cache vorhanden oder nicht erlaubt – dann eben neu laden */ }
      return null;
    }

    function inCacheLegen(daten) {
      try {
        localStorage.setItem(CACHE_NAME, JSON.stringify({
          stunde: jetztAlsText(),
          anzahl: punkte.length,
          zeiten: daten[0].hourly.time,                 // die Uhrzeiten nur einmal speichern
          wolken: daten.map(d => d.hourly.cloud_cover)  // pro Ort nur die Wolken-Zahlen
        }));
      } catch (fehler) { /* Speichern nicht möglich – nicht schlimm */ }
    }

    // Holt frische Wetterdaten und stellt Regler und Leiste auf "jetzt bis +24 h"
    async function ladeAlles() {
      const status = document.getElementById("status");
      const warAufJetzt = (aktuelleStunde === ersteStunde);   // stand der Regler auf "jetzt"?
      const alteZeit = zeiten[aktuelleStunde];

      const ausCache = ausCacheHolen();
      if (ausCache) {
        grobDaten = ausCache;                 // 0 Abfragen!
      } else {
        grobDaten = await ladeDaten(punkte);  // ~340 Abfragen
        inCacheLegen(grobDaten);
      }
      zeiten = grobDaten[0].hourly.time;
      feineWolken.clear();          // feine Daten sind jetzt veraltet – werden beim Zoomen neu geholt
      geladenFuerStunde = jetztAlsText();

      ersteStunde = Math.max(0, zeiten.indexOf(geladenFuerStunde));
      letzteStunde = Math.min(zeiten.length - 1, ersteStunde + 24);
      const regler = document.getElementById("zeitregler");
      regler.min = ersteStunde;
      regler.max = letzteStunde;

      // Stand der Regler auf "jetzt", wandert er mit. Sonst bleibt die gewählte Uhrzeit.
      let ziel = warAufJetzt ? ersteStunde : zeiten.indexOf(alteZeit);
      if (ziel < ersteStunde || ziel > letzteStunde) ziel = ersteStunde;

      if (zellen.length === 0) {
        status.textContent = "Bereite 5-km-Kästchen vor …";
        bereiteZellenVor();
      }
      zeigeStunde(ziel);

      const uhr = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      document.getElementById("live").textContent =
        "🟢 Live – zuletzt aktualisiert um " + uhr + " Uhr, nächstes Update zur vollen Stunde";
      status.textContent = "Klick auf die Karte für Details, zoom hinein für gemessene Wolken.";
      ladeFeineWolken();
    }

    async function start() {
      const status = document.getElementById("status");
      try {
        document.getElementById("zeitregler").addEventListener("input",
          (e) => zeigeStunde(Number(e.target.value)));

        // Jede Minute schauen: Hat eine neue Stunde angefangen (oder hat das Laden nicht geklappt)?
        // Dann frische Daten holen. Nur wenn die Seite gerade sichtbar ist – das spart Abfragen.
        setInterval(pruefeNeueStunde, 60 * 1000);
        document.addEventListener("visibilitychange", pruefeNeueStunde);

        await ladeAlles();
        karte.on("moveend", ladeFeineWolken);   // beim Bewegen/Zoomen: feine Wolken prüfen
      } catch (fehler) {
        status.textContent = "Ups, da ging was schief: " + fehler.message + ".";
      }
    }

    async function pruefeNeueStunde() {
      if (document.visibilityState !== "visible") return;
      if (jetztAlsText() === geladenFuerStunde) return;   // noch dieselbe Stunde
      try {
        await ladeAlles();
        karte.off("moveend", ladeFeineWolken);   // doppelt anmelden vermeiden
        karte.on("moveend", ladeFeineWolken);
      } catch (fehler) {
        document.getElementById("live").textContent =
          "🟠 Aktualisieren hat nicht geklappt – neuer Versuch in einer Minute.";
        document.getElementById("status").textContent = fehler.message + ".";
      }
    }

    start();
  </script>
</body>
</html>
